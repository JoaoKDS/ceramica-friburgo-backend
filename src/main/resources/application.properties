spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/olaria_friburgo}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

spring.security.user.name=${ADMIN_USER:admin}
spring.security.user.password=${ADMIN_PASSWORD}

# Porta: o servidor de hospedagem (Railway) define a PORT sozinho; local continua 8080
server.port=${PORT:8080}

# Evita manter a conexão com o banco aberta durante toda a requisição
spring.jpa.open-in-view=false

# Nunca mostrar detalhes internos nas respostas de erro
server.error.include-stacktrace=never